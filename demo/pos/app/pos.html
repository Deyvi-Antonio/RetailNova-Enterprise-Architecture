<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailNova · Caja de tienda</title><link rel="stylesheet" href="/static/ui.css">
<script src="/static/ui.js"></script><script src="/static/auth.js"></script>
<style>
.hero{background:linear-gradient(120deg,#7c2d12 0%,#c2410c 55%,#f97316 100%)}
.net{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:var(--radius);margin-bottom:16px;font-weight:600;box-shadow:var(--shadow)}
.net.on{background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.on .dot{background:#16a34a;box-shadow:0 0 0 4px #bbf7d0}.off .dot{background:#dc2626;box-shadow:0 0 0 4px #fecaca}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:0;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:left;cursor:pointer}
.tile:hover{outline:2px solid var(--accent)}.tile .ic{font-size:34px}.tile .n{font-size:13px;font-weight:600;margin:6px 0;min-height:34px}
.tile .p{font-weight:700;color:#c2410c}.tile .s{font-size:11px;color:var(--muted)}
.ticket{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;font-family:Consolas,monospace;font-size:13px}
.ticket .head{text-align:center;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:8px}
.ticket .ln{display:flex;justify-content:space-between;gap:6px;padding:5px 0}.ticket .ln span:last-child{white-space:nowrap}
.ticket .ln button{border:0;background:#fee2e2;color:#991b1b;border-radius:6px;cursor:pointer;width:22px}
.ticket .t{border-top:2px dashed var(--line);margin-top:8px;padding-top:8px}
.ticket .big{font-size:18px;font-weight:700}
select.store{width:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4)}
select.store option{color:#000}
</style></head><body>
<div id="rn-nav"></div>
<section class="hero"><div class="wrap"><div>
  <h1>🧾 Caja de tienda</h1><p>Punto de venta con base de datos local. Si se cae la red, la tienda sigue vendiendo y sincroniza con el ERP al volver.</p>
  <div class="pills"><span>Tienda: <select class="store" id="store" onchange="drawTicket()"></select></span><span id="cashier">Cajero: —</span></div>
</div><div id="session"></div></div></section>
<main><div class="wrap">
  <div id="gate"></div>
  <div class="net" id="net"></div>
  <div class="layout">
    <div><div class="card"><h3>Productos <span class="small muted" id="catState"></span></h3><div class="tiles" id="tiles"></div></div>
      <div class="card" style="margin-top:16px"><h3>Ventas de la tienda</h3><div id="sales"></div></div></div>
    <div class="sticky"><div class="ticket" id="ticket"></div>
      <p><button class="btn accent block" onclick="sell()">💳 Cobrar venta</button></p><div id="msg" class="small" style="color:var(--bad)"></div></div>
  </div>
</div></main>
<footer>RetailNova S.A. · Demo académica · Datos sintéticos</footer>
<script>
const $=id=>document.getElementById(id),E=RN.esc;let online=true,catalog=[],cart={};
$('store').innerHTML=Object.entries(RN.stores).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('');
async function loadNet(){online=(await (await fetch('/network')).json()).online;
  $('net').className='net '+(online?'on':'off');
  $('net').innerHTML=`<span><span class="dot"></span>${online?'Red conectada con la sede central':'Sin red: las ventas se guardan en la cola local de la tienda'}</span>
   <button class="btn ${online?'':'accent'}" onclick="toggle()">${online?'⚡ Simular caída de red':'🔌 Restablecer red'}</button>`;}
async function toggle(){const r=await Auth.api('/network',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({online:!online})});
  if(!RN.gate('gate',r,'cajero'))return;await loadNet();loadSales();setTimeout(loadCat,2500);}
async function loadCat(){const j=await (await fetch('/catalog')).json();catalog=j.products;
  $('catState').textContent=j.online?'(catálogo del ERP)':'(copia local del catálogo)';
  $('tiles').innerHTML=catalog.map(p=>`<button class="tile" onclick="add('${E(p.sku)}')"><div class="ic">${RN.cat[p.category]||'📦'}</div>
   <div class="n">${E(p.name)}</div><div class="p">${RN.sol(RN.conIgv(p.price))}</div><div class="s">Stock central: ${p.stock}</div></button>`).join('');drawTicket();}
function add(s){cart[s]=(cart[s]||0)+1;drawTicket()}
function rm(s){if(--cart[s]<=0)delete cart[s];drawTicket()}
function drawTicket(){let sub=0;const st=$('store').value;
  const lines=Object.entries(cart).map(([s,q])=>{const p=catalog.find(x=>x.sku===s)||{name:s,price:0};sub+=RN.conIgv(p.price)*q;
    return `<div class="ln"><span>${q}× ${E(p.name)}</span><span>${RN.sol(RN.conIgv(p.price)*q)} <button onclick="rm('${E(s)}')">−</button></span></div>`}).join('');
  const tot=Math.round(sub*100)/100,base=Math.round(tot/1.18*100)/100,igv=Math.round((tot-base)*100)/100;sub=base;
  $('ticket').innerHTML=`<div class="head"><b>RETAILNOVA S.A.</b><br>Tienda ${E(RN.store(st))} (${E(st)})<br>${new Date().toLocaleString('es-PE')}</div>
   ${lines||'<div class="muted" style="text-align:center;padding:14px 0">Toca un producto para agregarlo</div>'}
   <div class="t"><div class="ln"><span>Op. gravada</span><span>${RN.sol(sub)}</span></div><div class="ln"><span>IGV 18 %</span><span>${RN.sol(igv)}</span></div>
   <div class="ln big"><span>TOTAL</span><span>${RN.sol(tot)}</span></div></div><div class="muted" style="text-align:center;margin-top:8px">Cliente: consumidor final</div>`;}
async function sell(){const items=Object.entries(cart).map(([sku,qty])=>({sku,qty}));$('msg').textContent='';
  if(!items.length){$('msg').textContent='Agrega al menos un producto.';return}
  const r=await Auth.api('/sales',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items,store_id:$('store').value})});
  if(!RN.gate('gate',r,'cajero'))return;cart={};drawTicket();loadSales();}
async function loadSales(){const r=await Auth.api('/sales?limit=10');if(!RN.gate('gate',r,'cajero')){$('sales').innerHTML='';return}
  $('sales').innerHTML=r.data.length?`<table><tr><th>Venta</th><th>Tienda</th><th>Productos</th><th>Estado</th><th>Factura</th><th class="right">Total</th></tr>`+
   r.data.map(s=>`<tr><td class="mono">#${E(s.id.slice(0,8))}</td><td>${E(RN.store(s.store_id))}</td>
   <td>${E(s.items.map(i=>{const p=catalog.find(x=>x.sku===i.sku);return i.qty+'× '+(p?p.name:i.sku)}).join(', '))}</td>
   <td>${RN.chip(s.status)}</td><td>${s.invoice_id?'N.º '+E(s.invoice_id):'—'}</td><td class="right">${s.total?RN.sol(s.total):'—'}</td></tr>`).join('')+'</table>'
   :'<div class="empty">Sin ventas todavía.</div>';}
(async()=>{await Auth.handleCallback();RN.sessionBox('session');const c=Auth.claims();if(c)$('cashier').textContent='Cajero: '+(c.name||c.preferred_username);
  loadNet();loadCat();loadSales();setInterval(loadSales,2000);})();
</script></body></html>
