<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailNova · Tienda online</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#1d2433}
h1{margin:0 0 4px;color:#1f3864}small{color:#667}h3{margin-top:24px}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:6px 8px;border-bottom:1px solid #e3e6ec;text-align:left;font-size:14px}
input{padding:6px;border:1px solid #c8cdd6;border-radius:6px}button{padding:8px 16px;border:0;border-radius:6px;background:#1f3864;color:#fff;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 2fr 2fr;gap:8px}#msg{margin:8px 0;color:#b00020}
.b{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.PENDIENTE{background:#fff3cd}.ENVIADO{background:#dbe7ff}.CONFIRMADO{background:#d4f5dd}.RECHAZADO{background:#fde0e0}
</style></head><body>
<h1>RetailNova · Tienda online</h1>
<small>E-commerce con su propia base de datos. El cliente se registra en el CRM (ID único) y el pedido viaja al ERP por un evento en RabbitMQ.</small>
<h3>Catálogo <small id="catState"></small></h3><table id="cat"></table>
<h3>Cliente</h3>
<div class="grid"><input id="doc" value="45678912" placeholder="DNI"><input id="name" value="María Quispe" placeholder="Nombre completo"><input id="email" value="maria@example.com" placeholder="Correo"></div>
<p><button onclick="buy()">Comprar</button></p><div id="msg"></div>
<h3>Pedidos recientes</h3><table id="ord"></table>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
async function loadCat(){
  const j=await (await fetch('/catalog')).json();
  $('catState').textContent=j.online?'(publicado por el ERP)':'(ERP sin respuesta: última copia)';
  $('cat').innerHTML='<tr><th>SKU</th><th>Producto</th><th>Precio sin IGV</th><th>Stock</th><th>Cantidad</th></tr>'+
    j.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>S/ ${esc(p.price)}</td><td>${esc(p.stock)}</td>
    <td><input type="number" min="0" value="0" data-sku="${esc(p.sku)}" style="width:70px"></td></tr>`).join('');
}
async function loadOrders(){
  const os=await (await fetch('/orders')).json();
  $('ord').innerHTML='<tr><th>Pedido</th><th>Ítems</th><th>Estado</th><th>Factura ERP</th><th>Total</th><th>Detalle</th></tr>'+
    os.map(o=>`<tr><td>${esc(o.id.slice(0,8))}</td><td>${esc(o.items.map(i=>i.qty+'× '+i.sku).join(', '))}</td>
    <td><span class="b ${esc(o.status)}">${esc(o.status)}</span></td><td>${esc(o.invoice_id??'—')}</td>
    <td>${o.total?'S/ '+esc(o.total):'—'}</td><td>${esc(o.reason??'')}</td></tr>`).join('');
}
async function buy(){
  const items=[...document.querySelectorAll('#cat input')].map(i=>({sku:i.dataset.sku,qty:+i.value})).filter(i=>i.qty>0);
  $('msg').textContent='';
  if(!items.length){$('msg').textContent='Elige al menos un producto.';return}
  const r=await fetch('/orders',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({customer:{doc_type:'DNI',doc_number:$('doc').value,full_name:$('name').value,email:$('email').value},items})});
  if(!r.ok){const j=await r.json();$('msg').textContent='Error: '+JSON.stringify(j.detail);return}
  document.querySelectorAll('#cat input').forEach(i=>i.value=0);
  loadOrders();setTimeout(loadCat,2500);
}
loadCat();loadOrders();setInterval(loadOrders,2000);
</script></body></html>
