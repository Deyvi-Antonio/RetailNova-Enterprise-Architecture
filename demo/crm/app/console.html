<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailNova · CRM</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#1d2433}
h1{margin:0;color:#1f3864}small{color:#667}h3{margin-top:24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:6px 8px;border-bottom:1px solid #e3e6ec;text-align:left;font-size:13px}
button{padding:7px 14px;border:0;border-radius:6px;background:#1f3864;color:#fff;cursor:pointer}
.deny{background:#fde0e0;color:#8a1010;padding:10px 14px;border-radius:8px}.info{background:#eef3fb;padding:10px 14px;border-radius:8px}
.PERMITIDO{color:#137333;font-weight:600}.DENEGADO{color:#b00020;font-weight:600}
</style><script src="/static/auth.js"></script></head><body>
<div class="top"><div><h1>RetailNova · CRM</h1><small>Datos personales de clientes. Acceso por rol y con registro de auditoría (Ley N.º 29733).</small></div>
<div id="session"></div></div>
<h3>Clientes</h3><div id="cust"></div>
<h3>Registro de auditoría <small>(solo administrador)</small></h3><div id="audit"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const msg=(r)=>r.status===401?'<div class="info">Inicia sesión para ver esta sección.</div>':`<div class="deny">⛔ ${esc(r.data?.detail||'Sin permiso')}</div>`;
async function load(){
  const c=await Auth.api('/customers');
  $('cust').innerHTML=c.ok?'<table><tr><th>ID único</th><th>Documento</th><th>Nombre</th><th>Correo</th><th>Registrado</th></tr>'+
    c.data.map(x=>`<tr><td>${esc(x.customer_id.slice(0,8))}</td><td>${esc(x.doc_type)} ${esc(x.doc_number)}</td><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc((x.created_at||'').slice(0,10))}</td></tr>`).join('')+'</table>':msg(c);
  const a=await Auth.api('/audit');
  $('audit').innerHTML=a.ok?'<table><tr><th>Fecha y hora</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Recurso</th><th>Resultado</th></tr>'+
    a.data.map(x=>`<tr><td>${esc(new Date(x.at).toLocaleString('es-PE'))}</td><td>${esc(x.usuario)}</td><td>${esc(x.roles)}</td><td>${esc(x.accion)}</td><td>${esc(x.recurso)}</td><td class="${esc(x.resultado)}">${esc(x.resultado)}</td></tr>`).join('')+'</table>':msg(a);
}
(async()=>{await Auth.handleCallback();Auth.bar('session');load();})();
</script></body></html>
